<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>アカウント作成</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}" />
</head>
<body>
  <div class="login-container">
    <h1>UNICON</h1> <!-- ここを追加 -->
    <h2>アカウント作成</h2>
    <p class="tagline">🌿 大学の『今』がわかる、混雑状況管理アプリ 🌿</p>
    <form id="register-form">
      <div class="input-group">
        <label for="studentId">学籍番号</label>
        <input type="text" id="studentId" name="studentId" required />
      </div>
      <div class="input-group">
        <label for="password">パスワード</label>
        <input type="password" id="password" name="password" required />
      </div>
      <button type="submit">登録する</button>
      <p class="error-message" id="error-message" style="display: none;"></p>
    </form>
  </div>

  <script>
    document.getElementById("register-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const studentId = document.getElementById("studentId").value;
      const password = document.getElementById("password").value;

      const res = await fetch("/api/login", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ studentId, password }),
      });

      const data = await res.json();
      const errorMessage = document.getElementById("error-message");

      if (data.success) {
        window.location.href = "/index";
      } else {
        errorMessage.textContent = data.message || "エラーが発生しました";
        errorMessage.style.display = "block";
      }
    });
  </script>
</body>
</html>
