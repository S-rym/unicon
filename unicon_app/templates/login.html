<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>UNICON ログイン</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/login_style.css') }}" />

  <!-- NProgress CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css" />
  
  <style>
    /* NProgressのバーの色・高さカスタマイズ例 */
    #nprogress .bar {
      background: #00aa88 !important;
      height: 20px !important;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-box">
      <h1>UNICON</h1>
      <p class="tagline">🌿混雑状況管理アプリ🌿</p>

      <form id="loginForm" action="#" method="POST">
        <div class="input-group">
          <label for="studentId">学籍番号:</label>
          <input type="text" id="studentId" name="studentId" required />
        </div>
        <div class="input-group">
          <label for="password">パスワード:</label>
          <input type="password" id="password" name="password" required />
        </div>

        <button type="submit">ログイン</button>
        <button type="button" id="createAccountBtn">アカウント作成</button>
      </form>

      <p id="errorMessage" class="error-message"></p>
    </div>
  </div>

  <!-- NProgress JS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>

  <!-- login.js の読み込み -->
  <script src="{{ url_for('static', filename='js/login.js') }}"></script>
</body>
</html>
